# Unsigned device IPA for TrollStore. No Apple account, no secrets, no local Mac.
# Derived from the upstream ios-ci.yml (expo prebuild + CocoaPods + xcodebuild),
# switched from iphonesimulator/Debug to iphoneos/Release and packed as .ipa.
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-13
    timeout-minutes: 45
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Expo config
        run: npx expo config --type introspect --json > expo-config.introspect.json

      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Resolve workspace and scheme
        id: xc
        run: |
          set -euo pipefail
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          workspace="${workspaces[0]:-}"
          if [ -z "$workspace" ]; then
            echo "::error::No .xcworkspace generated by expo prebuild."
            exit 1
          fi
          scheme=$(xcodebuild -workspace "$workspace" -list -json | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const all = (d.workspace && d.workspace.schemes) || [];
            const app = all.filter((s) => s !== 'Pods' && !s.startsWith('Pods-'));
            if (app.length === 0) { console.error('No application scheme found'); process.exit(1); }
            process.stdout.write(app[0]);
          ")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iphoneos app
        run: |
          set -euo pipefail
          NSUnbufferedIO=YES xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee xcodebuild.log

      - name: Pack IPA
        run: |
          set -euo pipefail
          app=$(find ios/build/Build/Products -maxdepth 2 -type d -name '*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::No .app product found after xcodebuild."
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry OpenCode-unsigned.ipa Payload
          shasum -a 256 OpenCode-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-unsigned-IPA
          path: OpenCode-unsigned.ipa
          retention-days: 30

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
